server {
    listen 443 ssl;
    server_name secsoso.com;

    ssl_certificate      /etc/nginx/ssl/secsoso.com.fullchain.cer;
    ssl_certificate_key  /etc/nginx/ssl/secsoso.com.key;

    root /data/www/secsoso.com/html;

    location / {
        index index.html;
        try_files   $uri $uri/ /index.html;
    }

    if ($http_user_agent ~* (SemrushBot|DotBot|MJ12bot|AhrefsBot|MauiBot|MegaIndex.ru|BLEXBot|ZoominfoBot|ExtLinksBot|hubspot|leiki|webmeup|Go-http-client|python-requests)) {
        return 403;
    }

    access_log  /var/log/nginx/secsoso.com.access.log;
    error_log  /var/log/nginx/secsoso.com.error.log;

}

server {
    listen 80;
    server_name www.secsoso.com secsoso.com;
    return 301 https://secsoso.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.secsoso.com;

    ssl_certificate      /etc/nginx/ssl/secsoso.com.fullchain.cer;
    ssl_certificate_key  /etc/nginx/ssl/secsoso.com.key;

    return 301 https://secsoso.com$request_uri;
}