    results_query: data/data_list
    title_query: post_title
    content_query: content
    url_prefix: https://www.freebuf.com
    url_query: url
    word_segment: true
    categories: [standards]
    timeout: 6.0
    weight: 5.0
    shortcut: frbs

  - name: freebuf job
    engine: json
    paging: true
    first_page_num: 1
    search_url: https://www.freebuf.com/fapi/frontend/search/article?content={query}&articleType=%E6%8B%9B%E8%81%98&year=&time=0&page={pageno}&limit=20
    headers:
      accept: application/json
      Content-Type: application/json
    results_query: data/data_list
    title_query: post_title
    content_query: content
    url_prefix: https://www.freebuf.com
    url_query: url
    word_segment: true
    categories: [job]
    timeout: 6.0
    weight: 100.0
    shortcut: frbj

  - name: freebuf paper
    engine: json
    paging: true
    first_page_num: 1
    search_url: https://fapi.freebuf.com/gapi/web/search/resources?keyword={query}&page={pageno}&page_size=20&identify=&type=&society_id=0
    headers:
      accept: application/json
      Content-Type: application/json
    results_query: data/items
    title_query: file_name
    content_query: file_summary
    url_prefix: https://wiki.freebuf.com/societyDetail/articleDetail?article_id=
    url_query: article_id
    categories: [paper]
    timeout: 6.0
    weight: 100.0
    shortcut: frbp

  - name: vipread
    engine: xpath
    paging: true
    first_page_num: 1
    search_url: https://vipread.com/library/search?keyword={query}&page={pageno}
    results_xpath: //div[contains(@class,"row")]//div[contains(@class,"col-md-6")]
    url_xpath: .//h5[contains(@class,"ui-v2")]/a[last()]/@href
    title_xpath: .//h5[contains(@class,"ui-v2")]//text()
    content_xpath: .//h5[contains(@class,"ui-v2")]/..//text()
    url_prefix: https://vipread.com/
    verify: false
    word_segment: true
    enable_http: true
    categories: [paper]
    timeout: 6.0
    weight: 200
    shortcut: vrd

  - name: seebug paper
    engine: xpath
    paging: true
    first_page_num: 1
    search_url: https://paper.seebug.org/?keyword={query}
    results_xpath: //div[@class="main-inner"]/article
    url_xpath: ./header[@class="post-header"]/h5[@class="post-title"]/a[last()]/@href
    title_xpath: ./header[@class="post-header"]/h5[@class="post-title"]/a[last()]/text()
    content_xpath: .//section[@class="post-content"]/text()
    url_prefix: https://paper.seebug.org
    word_segment: true
    categories: [paper]
    timeout: 6.0
    weight: 80
    shortcut: sbp

  - name: hackinn
    engine: xpath
    paging: true
    first_page_num: 1
    search_url: https://www.hackinn.com/search/?keyword={query}
    results_xpath: //tbody/tr
    url_xpath: ./td[2]/a/@href
    title_xpath: ./td[@class="size"]/text()
    content_xpath: ./td[@class="date"]/text()
    categories: [paper]
    timeout: 6.0
    weight: 90
    shortcut: hcki

