    search_url: https://www.freebuf.com/fapi/frontend/search/article?content={query}&articleType=WEB%E5%AE%89%E5%85%A8,%E6%97%A0%E7%BA%BF%E5%AE%89%E5%85%A8,%E4%BC%81%E4%B8%9A%E5%AE%89%E5%85%A8,%E7%B3%BB%E7%BB%9F%E5%AE%89%E5%85%A8,%E7%BB%88%E7%AB%AF%E5%AE%89%E5%85%A8,%E5%B7%A5%E6%8E%A7%E5%AE%89%E5%85%A8,%E6%95%B0%E6%8D%AE%E5%AE%89%E5%85%A8,%E7%BD%91%E7%BB%9C%E5%AE%89%E5%85%A8,%E5%AE%B9%E5%99%A8%E5%AE%89%E5%85%A8,%E6%A0%87%E5%87%86%E4%B8%8E%E5%90%88%E8%A7%84,%E5%AE%89%E5%85%A8%E7%AE%A1%E7%90%86,%E5%85%&year=&time=0&page={pageno}&limit=20
    headers:
      accept: application/json
      Content-Type: application/json
    results_query: data/data_list
    title_query: post_title
    content_query: content
    url_prefix: https://www.freebuf.com
    url_query: url
    categories: [technical]
    timeout: 6.0
    weight: 10.0
    shortcut: frbt

